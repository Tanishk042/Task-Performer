{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-card__head">
      <span class="label">Accounts Payable</span>
      <h1 class="h1">Sign in</h1>
      <p class="body-medium muted">Internal finance system.</p>
    </div>

    {% if error %}
    <div class="notice notice--error" role="alert" id="login-error">
      <div class="notice__title">Could not sign in</div>
      <p class="body-medium">{{ error }}</p>
    </div>
    {% endif %}

    <form method="post" action="/login" novalidate>
      <input type="hidden" name="redirect" value="{{ redirect }}">
      <div class="field">
        <label class="field__label" for="username">Email</label>
        <input class="input" id="username" name="username" type="email"
               autocomplete="username" value="{{ username or '' }}" required>
      </div>
      <div class="field">
        <label class="field__label" for="password">Password</label>
        <input class="input" id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <button class="button" type="submit" id="sign-in">Sign in</button>
    </form>

    <p class="auth-card__foot body-small">Seeded credentials — see <code>README.md</code>.</p>
  </div>
</div>
{% endblock %}
